# ========================================================
# GitHub Actions Workflow công khai cho repo rust-mantis-bt
# Tự động test, build container image và xuất bản lên GHCR
# ========================================================
name: Build and Publish Container Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  workflow_call:
    inputs:
      release_tag:
        description: 'Release git tag (e.g. v1.4.0)'
        required: false
        type: string
        default: ''
      commit_sha:
        description: 'Commit SHA to checkout and build'
        required: false
        type: string
        default: ''
      is_prerelease:
        description: 'Whether the release is a prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-${{ inputs.commit_sha || github.ref }}
      cancel-in-progress: ${{ inputs.release_tag == '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: cargo fmt --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --verbose

  build-and-publish:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-docker-${{ inputs.commit_sha || github.ref }}
      cancel-in-progress: ${{ inputs.release_tag == '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Resolve release context
        id: release_ctx
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.is_prerelease }}
          TARGET_SHA: ${{ inputs.commit_sha || github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          release_tag="$INPUT_TAG"
          is_prerelease="$INPUT_PRERELEASE"
          if [ -z "$release_tag" ] && [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            release_tag="$REF_NAME"
            if [[ "$release_tag" == *-* ]]; then
              is_prerelease="true"
            else
              is_prerelease="false"
            fi
          fi
          push_latest="false"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$is_prerelease" != "true" ]; then
            main_head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null || true)
            if [ -n "$main_head" ] && [ "$TARGET_SHA" = "$main_head" ]; then
              push_latest="true"
            fi
          fi
          {
            echo "release_tag=$release_tag"
            echo "is_prerelease=$is_prerelease"
            echo "push_latest=$push_latest"
          } >> "$GITHUB_OUTPUT"

      - name: Set lower case repository name for GHCR
        run: |
          echo "IMAGE_REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_REPOSITORY }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.release_ctx.outputs.push_latest == 'true' }}
            type=sha,format=short,prefix=
            type=sha,format=long,prefix=
            type=semver,pattern=v{{version}},value=${{ steps.release_ctx.outputs.release_tag }},enable=${{ steps.release_ctx.outputs.release_tag != '' }}
            type=semver,pattern={{version}},value=${{ steps.release_ctx.outputs.release_tag }},enable=${{ steps.release_ctx.outputs.release_tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release_ctx.outputs.release_tag }},enable=${{ steps.release_ctx.outputs.release_tag != '' && steps.release_ctx.outputs.is_prerelease != 'true' }}
            type=ref,event=tag,enable=${{ inputs.release_tag == '' }}

      - name: Build and push multi-arch Docker image (ARM64 & AMD64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
