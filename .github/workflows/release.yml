# ========================================================
# Automated Release Tag, GitHub Release & GHCR Publish
# Driven by [package].version in Cargo.toml on push to main
# ========================================================
name: Auto Release

on:
  push:
    branches:
      - main

# Deny-by-default permissions baseline; each job grants only what it needs.
permissions: {}

# Serialize all main pushes in order. GitHub keeps at most one pending run per
# group when cancel-in-progress is false; intermediate queued runs are dropped,
# which is safe because the surviving run builds and evaluates the latest main.
concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check Cargo.toml Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
      is_prerelease: ${{ steps.check.outputs.prerelease }}
      commit_sha: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check Cargo.toml version against existing tags
        id: check
        shell: python3 {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os
          import re
          import subprocess
          import sys

          def write_output(values: dict[str, str]) -> None:
              out_path = os.environ["GITHUB_OUTPUT"]
              with open(out_path, "a", encoding="utf-8") as f:
                  for k, v in values.items():
                      f.write(f"{k}={v}\n")

          def read_cargo_version() -> str:
              with open("Cargo.toml", "rb") as f:
                  raw = f.read()
              try:
                  import tomllib  # Python 3.11+
                  data = tomllib.loads(raw.decode("utf-8"))
                  ver = data.get("package", {}).get("version")
                  if isinstance(ver, str):
                      return ver.strip()
              except ModuleNotFoundError:
                  pass

              text = raw.decode("utf-8")
              in_pkg = False
              for line in text.splitlines():
                  stripped = line.strip()
                  if stripped.startswith("["):
                      in_pkg = stripped == "[package]"
                      continue
                  if in_pkg:
                      m = re.match(r'^version\s*=\s*"([^"]+)"', stripped)
                      if m:
                          return m.group(1).strip()
              raise RuntimeError("Could not find [package].version in Cargo.toml")

          # Strict SemVer 2.0.0 without '+build' metadata (Docker tags reject '+').
          SEMVER_RE = re.compile(
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
              r"(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
              r"(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?"
          )
          LEGACY_TAG_RE = re.compile(
              r"v?([0-9]+)\.([0-9]+)(?:\.([0-9]+))?(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?"
          )

          def parse_strict_semver(ver: str):
              m = SEMVER_RE.fullmatch(ver)
              if not m:
                  return None
              major, minor, patch = int(m.group(1)), int(m.group(2)), int(m.group(3))
              pre = tuple(m.group(4).split(".")) if m.group(4) else ()
              return (major, minor, patch, pre)

          def parse_tag_semver(tag_name: str):
              m = LEGACY_TAG_RE.fullmatch(tag_name)
              if not m:
                  return None
              major = int(m.group(1))
              minor = int(m.group(2))
              patch = int(m.group(3)) if m.group(3) is not None else 0
              pre = tuple(m.group(4).split(".")) if m.group(4) else ()
              return (major, minor, patch, pre)

          def cmp_pre_id(a: str, b: str) -> int:
              a_num = a.isdigit()
              b_num = b.isdigit()
              if a_num and b_num:
                  ia, ib = int(a), int(b)
                  return (ia > ib) - (ia < ib)
              if a_num != b_num:
                  return -1 if a_num else 1
              return (a > b) - (a < b)

          def cmp_semver(a, b) -> int:
              for idx in range(3):
                  if a[idx] != b[idx]:
                      return (a[idx] > b[idx]) - (a[idx] < b[idx])
              pre_a, pre_b = a[3], b[3]
              if not pre_a and not pre_b:
                  return 0
              if not pre_a:
                  return 1
              if not pre_b:
                  return -1
              for id_a, id_b in zip(pre_a, pre_b):
                  c = cmp_pre_id(id_a, id_b)
                  if c != 0:
                      return c
              return (len(pre_a) > len(pre_b)) - (len(pre_a) < len(pre_b))

          version = read_cargo_version()
          parsed_cargo = parse_strict_semver(version)
          if parsed_cargo is None:
              print(
                  f"ERROR: Cargo.toml version '{version}' must be strict SemVer 2.0.0 X.Y.Z[-prerelease] without '+build' metadata.",
                  file=sys.stderr,
              )
              sys.exit(1)

          tag = f"v{version}"
          is_prerelease = bool(parsed_cargo[3])

          repo = os.environ["GITHUB_REPOSITORY"]
          tags_raw = subprocess.check_output(
              ["gh", "api", "--paginate", f"repos/{repo}/tags", "--jq", ".[].name"],
              text=True,
          )
          existing_tags = {line.strip() for line in tags_raw.splitlines() if line.strip()}

          should_release = True
          if tag in existing_tags or version in existing_tags:
              print(f"Skipping release: tag '{tag}' or '{version}' already exists.")
              should_release = False
          else:
              highest_tag_name = None
              highest_ver = None
              for t in existing_tags:
                  parsed = parse_tag_semver(t)
                  if parsed is None:
                      continue
                  # Stable versions only compare against stable tags so a hotfix (e.g. 1.4.1)
                  # is not blocked by an active prerelease tag (e.g. v2.0.0-rc.1).
                  if not is_prerelease and parsed[3]:
                      continue
                  if highest_ver is None or cmp_semver(parsed, highest_ver) > 0:
                      highest_ver = parsed
                      highest_tag_name = t

              if highest_ver is not None:
                  cmp_res = cmp_semver(parsed_cargo, highest_ver)
                  if cmp_res < 0:
                      print(
                          f"::warning::Cargo.toml version '{version}' is lower than highest existing tag '{highest_tag_name}' — skipping release."
                      )
                      should_release = False
                  elif cmp_res == 0:
                      print(
                          f"Skipping release: Cargo.toml version '{version}' matches highest existing tag '{highest_tag_name}'."
                      )
                      should_release = False

              if should_release:
                  print(
                      f"Ready to release {tag} (prerelease={is_prerelease}, previous highest={highest_tag_name})."
                  )

          write_output({
              "should_release": "true" if should_release else "false",
              "tag": tag,
              "prerelease": "true" if is_prerelease else "false",
          })

  prepare-release:
    name: Create Draft Release
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Create or reuse draft release for exact commit
        id: draft
        shell: python3 {0}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          IS_PRERELEASE: ${{ needs.check.outputs.is_prerelease }}
          TARGET_SHA: ${{ needs.check.outputs.commit_sha }}
        run: |
          import os
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          is_prerelease = os.environ["IS_PRERELEASE"] == "true"
          target_sha = os.environ["TARGET_SHA"]

          drafts_raw = subprocess.check_output(
              [
                  "gh",
                  "api",
                  "--paginate",
                  f"repos/{repo}/releases?per_page=100",
                  "--jq",
                  ".[] | select(.draft == true) | [.id, .tag_name, .target_commitish] | @tsv",
              ],
              text=True,
          )

          for line in drafts_raw.splitlines():
              if not line.strip():
                  continue
              parts = line.split("\t")
              if len(parts) < 3:
                  continue
              existing_id, existing_tag, existing_sha = parts[0], parts[1], parts[2]
              if existing_tag != tag:
                  continue
              if existing_sha == target_sha:
                  print(f"Reusing existing draft release {existing_id} for {tag} at {target_sha}.")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                      f.write(f"release_id={existing_id}\n")
                  raise SystemExit(0)
              print(
                  f"::warning::Replacing stale draft release {existing_id} for '{tag}' "
                  f"(old target {existing_sha}, new target {target_sha})."
              )
              subprocess.check_call(
                  ["gh", "api", "-X", "DELETE", f"repos/{repo}/releases/{existing_id}"]
              )

          created_id = subprocess.check_output(
              [
                  "gh",
                  "api",
                  "-X",
                  "POST",
                  f"repos/{repo}/releases",
                  "-f",
                  f"tag_name={tag}",
                  "-f",
                  f"target_commitish={target_sha}",
                  "-f",
                  f"name={tag}",
                  "-F",
                  "draft=true",
                  "-F",
                  f"prerelease={'true' if is_prerelease else 'false'}",
                  "-F",
                  "generate_release_notes=true",
                  "--jq",
                  ".id",
              ],
              text=True,
          ).strip()
          print(f"Created draft release {created_id} for {tag} targeting {target_sha}.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"release_id={created_id}\n")

  publish-image:
    name: Build & Publish Container Image
    needs: [check, prepare-release]
    if: >-
      !cancelled() &&
      needs.check.result == 'success' &&
      (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-and-publish.yml
    with:
      release_tag: ${{ needs.check.outputs.should_release == 'true' && needs.check.outputs.tag || '' }}
      commit_sha: ${{ needs.check.outputs.commit_sha }}
      is_prerelease: ${{ needs.check.outputs.is_prerelease == 'true' }}

  publish-release:
    name: Publish GitHub Release & Tag
    needs: [check, prepare-release, publish-image]
    if: >-
      needs.check.outputs.should_release == 'true' &&
      needs.prepare-release.result == 'success' &&
      needs.publish-image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Note: Releases published with GITHUB_TOKEN do not trigger `on: release` workflows.
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false
